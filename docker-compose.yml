services:
  db:
    image: mysql:9.7
    container_name: stock_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-stockdb}
      MYSQL_USER: ${DB_USER:-stock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PORT_DB:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  migrate:
    image: mysql:9.7
    restart: "no"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_DATABASE:-stockdb}
      MYSQL_USER: ${DB_USER:-stock_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stock_password}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/migrations/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build: ./backend
    container_name: stock_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      PORT_DB: 3306
      DB_USER: ${DB_USER:-stock_user}
      DB_PASSWORD: ${DB_PASSWORD:-stock_password}
      DB_DATABASE: ${DB_DATABASE:-stockdb}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    ports:
      - "${PORT_APP:-4000}:4000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  internal:
    driver: bridge

volumes:
  db_data:
